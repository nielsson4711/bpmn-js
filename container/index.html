<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>bpmn-js Modeler</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⚙️</text></svg>">
  <link rel="stylesheet" href="assets/diagram-js.css">
  <link rel="stylesheet" href="assets/bpmn-js.css">
  <link rel="stylesheet" href="assets/bpmn-font/css/bpmn.css">
  <style>
    :root {
      --bg: #fafafa; --panel: #fff; --border: #ddd; --text: #333;
    }
    html[data-theme="dark"] {
      --bg: #1e1e1e; --panel: #2b2b2b; --border: #444; --text: #ddd;
    }
    html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); }
    #app { display: flex; flex-direction: column; height: 100%; }
    header {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 8px; padding: 6px 10px; flex: none;
      border-bottom: 1px solid var(--border); background: var(--bg);
      color: var(--text);
    }
    header strong { margin-right: auto; font: 600 14px sans-serif; color: var(--text); }
    header button {
      padding: 5px 14px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--panel); color: var(--text); cursor: pointer; font: 13px sans-serif;
    }
    header button:hover { filter: brightness(1.1); }
    #canvas { flex: 1; min-height: 0; }
    html[data-theme="dark"] .djs-palette,
    html[data-theme="dark"] .djs-popup {
      background: var(--panel) !important;
      border-color: var(--border) !important;
      color: var(--text);
    }
    html[data-theme="dark"] .djs-palette .entry:hover {
      background: #3a3a3a !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <strong>bpmn-js Modeler</strong>
      <button type="button" id="btn-theme" title="Design wechseln">🌓</button>
      <button type="button" id="btn-open">Öffnen</button>
      <button type="button" id="btn-save">Speichern</button>
      <input type="file" id="file-input" accept=".bpmn,.xml" hidden>
    </header>
    <div id="canvas"></div>
  </div>
  <script>
    (function() {
      const modes = ['auto', 'light', 'dark'];
      let mode = localStorage.getItem('bpmnjs-theme') || 'auto';

      function applyTheme() {
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = mode === 'dark' || (mode === 'auto' && systemDark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      }

      function themeLabel() {
        return { auto: '🌓', light: '☀️', dark: '🌙' }[mode];
      }

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

      document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('btn-theme');
        btn.addEventListener('click', () => {
          mode = modes[(modes.indexOf(mode) + 1) % modes.length];
          localStorage.setItem('bpmnjs-theme', mode);
          applyTheme();
          btn.textContent = themeLabel();
        });
        btn.textContent = themeLabel();
      });

      applyTheme();
    })();
  </script>
  <script src="bpmn-modeler.production.min.js"></script>
  <script>
    const modeler = new BpmnJS({ container: '#canvas' });

    fetch('initial.bpmn')
      .then(r => r.ok ? r.text() : modeler.createDiagram())
      .then(xml => modeler.importXML(xml))
      .then(() => console.log('Diagramm gerendert'))
      .catch(err => console.error('Fehler beim Rendern', err));

    let currentFileName = null;

    const fileInput = document.getElementById('file-input');

    document.getElementById('btn-open').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      file.text().then(xml => modeler.importXML(xml))
        .then(() => {
          currentFileName = file.name;
          console.log('Diagramm geladen:', file.name);
        })
        .catch(err => console.error('Fehler beim Laden', err));
      fileInput.value = '';
    });

    function nextFileName() {
      const today = new Date();
      const yyyymmdd = [
        today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, '0'),
        String(today.getDate()).padStart(2, '0')
      ].join('');
      const key = 'bpmnjs-seq-' + yyyymmdd;
      const next = String((parseInt(localStorage.getItem(key) || '0', 10) + 1)).padStart(2, '0');
      localStorage.setItem(key, String(parseInt(next, 10)));
      return yyyymmdd + '-bpmnjs-' + next + '.bpmn';
    }

    async function saveViaFilePicker(suggestedName) {
      if (!window.showSaveFilePicker) return null;
      let handle;
      try {
        handle = await window.showSaveFilePicker({
          suggestedName,
          types: [{ description: 'BPMN-Diagramm', accept: { 'application/xml': ['.bpmn'] } }]
        });
      } catch (err) {
        if (err.name === 'AbortError') return false;
        throw err;
      }
      const { xml } = await modeler.saveXML({ format: true });
      const writable = await handle.createWritable();
      await writable.write(new Blob([xml], { type: 'application/xml' }));
      await writable.close();
      currentFileName = handle.name;
      return true;
    }

    async function saveViaDownload(suggestedName) {
      const fileName = prompt('Dateiname:', suggestedName);
      if (!fileName) return false;
      const { xml } = await modeler.saveXML({ format: true });
      const blob = new Blob([xml], { type: 'application/xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName.endsWith('.bpmn') ? fileName : fileName + '.bpmn';
      currentFileName = a.download;
      a.click();
      URL.revokeObjectURL(a.href);
      return true;
    }

    document.getElementById('btn-save').addEventListener('click', async () => {
      const suggested = currentFileName || nextFileName();
      try {
        const saved = await saveViaFilePicker(suggested);
        if (saved !== true) await saveViaDownload(suggested);
      } catch (err) {
        console.error('Fehler beim Speichern', err);
      }
    });
  </script>
</body>
</html>
