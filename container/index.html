<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>bpmn-js Modeler</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⚙️</text></svg>">
  <link rel="stylesheet" href="assets/bpmn-js.css">
  <link rel="stylesheet" href="assets/bpmn-font/css/bpmn.css">
  <style>
    html, body, #canvas { height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="canvas"></div>
  <script src="bpmn-modeler.production.min.js"></script>
  <script>
    const modeler = new BpmnJS({ container: '#canvas' });

    fetch('initial.bpmn')
      .then(r => r.ok ? r.text() : modeler.createDiagram())
      .then(xml => modeler.importXML(xml))
      .then(() => console.log('Diagramm gerendert'))
      .catch(err => console.error('Fehler beim Rendern', err));
  </script>
</body>
</html>
